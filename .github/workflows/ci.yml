smoke-test:
  runs-on: ubuntu-latest
  needs: test

  services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Esperar a que PostgreSQL esté listo
        run: |
          for i in {1..10}; do
            if pg_isready -h localhost -U test_user -d test_db; then
              echo "PostgreSQL está listo"
              exit 0
            fi
            echo "Esperando PostgreSQL... $i"
            sleep 3
          done
          echo "PostgreSQL no está listo"
          exit 1

      - name: Ejecutar migraciones
        env:
          DATABASE_URL: postgresql+psycopg://test_user:test_pass@localhost:5432/test_db
        run: alembic upgrade head

      - name: Crear sensor (smoke test)
        env:
          DATABASE_URL: postgresql+psycopg://test_user:test_pass@localhost:5432/test_db
        run: |
          python -c "
          import os
          from app.db import SessionLocal
          from app.models import SensorModel

          db = SessionLocal()
          try:
              sensor = SensorModel(id='SMOKE-TEST-01', location='CI', type='temperature')
              db.add(sensor)
              db.commit()
              print('✅ Sensor creado correctamente')
          except Exception as e:
              print(f'❌ Error al crear sensor: {e}')
              exit(1)
          finally:
              db.close()
          "

      - name: Crear lectura (smoke test)
        env:
          DATABASE_URL: postgresql+psycopg://test_user:test_pass@localhost:5432/test_db
        run: |
          python -c "
          import os
          from datetime import datetime
          from app.db import SessionLocal
          from app.models import ReadingModel

          db = SessionLocal()
          try:
              reading = ReadingModel(
                  sensor_id='SMOKE-TEST-01',
                  value=25.5,
                  unit='C',
                  timestamp=datetime.utcnow()
              )
              db.add(reading)
              db.commit()
              print('✅ Lectura creada correctamente')
          except Exception as e:
              print(f'❌ Error al crear lectura: {e}')
              exit(1)
          finally:
              db.close()
          "

      - name: Consultar lecturas (smoke test)
        env:
          DATABASE_URL: postgresql+psycopg://test_user:test_pass@localhost:5432/test_db
        run: |
          python -c "
          from app.db import SessionLocal
          from app.models import ReadingModel

          db = SessionLocal()
          try:
              count = db.query(ReadingModel).count()
              print(f'✅ {count} lecturas encontradas en la base de datos')
          except Exception as e:
              print(f'❌ Error al consultar: {e}')
              exit(1)
          finally:
              db.close()
          "

      - name: Smoke test completado ✅
        run: echo "¡Todos los tests de humo pasaron correctamente!"