name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Lint
        run: ruff check .
      - name: Types
        run: mypy app --ignore-missing-imports
      - name: Tests with coverage
        run: pytest --cov=app --cov-fail-under=80

  smoke-test:
    runs-on: ubuntu-latest
    needs: test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/test_db
      PYTHONPATH: .

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Esperar a que PostgreSQL esté listo
        run: |
          for i in {1..10}; do
            if pg_isready -h localhost -U test_user -d test_db; then
              echo "PostgreSQL está listo"
              exit 0
            fi
            echo "Esperando PostgreSQL... $i"
            sleep 3
          done
          echo "PostgreSQL no está listo"
          exit 1

      - name: Ejecutar migraciones
        run: alembic upgrade head

      - name: Smoke test (crear sensor + lectura + verificar alerta)
        run: python scripts/smoke_test.py