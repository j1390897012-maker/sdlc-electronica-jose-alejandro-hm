services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sensor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}  # ⚠️ Valor por defecto, pero extraído de variable
      POSTGRES_DB: ${POSTGRES_DB:-sensorhub}
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: