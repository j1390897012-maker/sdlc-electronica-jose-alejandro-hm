[tool.ruff]
lint.select = [
    "E",
    "F",
    "I",
    "UP",
    "B"
]

exclude = [
    "semana0",
    "semana1",
]

[tool.pytest.ini_options]
addopts = "--cov=. --cov-fail-under=80"
pythonpath = [
    "."
]

[tool.mypy]
disallow_untyped_defs = true
exclude = "^(semana0|semana1)/"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
]